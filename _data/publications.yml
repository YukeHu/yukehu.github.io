# Single source for the publication list, newest first.
#
# Rendered by _includes/publication.html in two places:
#   /publications/  all entries, grouped by year
#   homepage        entries marked `selected: true`
#
# Fields
#   title     official title; it links to `url`
#   authors   in order; keep * (equal contribution) and † (corresponding author)
#   venue     full venue name
#   short     venue abbreviation shown in the tag
#   journal   optional, true for journal papers: the tag then shows the
#             abbreviation alone, without the year
#   year      year heading on /publications/; for journal papers this is
#             the early-access year, not the year of the printed issue
#   note      optional extra tag, e.g. Spotlight
#   selected  optional, true to also show the entry on the homepage
#   url       the one link of the entry: the paper's page on the official
#             conference or publisher site; arXiv only if there is no such page

